identity:
  author: "sawyer-shi"
  name: "tongyi_aigc"
  label:
    en_US: "TongYi AIGC"
    zh_Hans: "通义AIGC"
  description:
    en_US: 'TongYi AIGC: Supports full-featured image and video generation using the latest Alibaba Tongyi models (HappyHorse1.1, wan2.7, qwen-image2.0, Z-image, wan2.6,wan2.5, wan2.2, and wanx2.1).'
    zh_Hans: '通义AIGC：支持全套图片+视频的生成、编辑等操作，使用最新的阿里通义模型(HappyHorse1.1、wan2.7、qwen-image2.0、Z-Image以及wan2.6、wan2.5、wan2.2和wanx2.1)。'
  icon: "icon.svg"
credentials_for_provider:
  api_key:
    help:
      en_US: Get your API key from the same Alibaba Cloud Bailian workspace as the Base URL below.
      zh_Hans: 请使用与下方 Base URL 属于同一阿里云百炼业务空间的 API Key。
    label:
      en_US: Bailian API Key
      zh_Hans: Bailian API Key
    placeholder:
      en_US: Please input your Bailian API Key
      zh_Hans: 请输入您的百炼 API Key
    required: true
    type: secret-input
    url: https://dashscope.console.aliyun.com/apiKey
  base_url:
    help:
      en_US: Paste the Base URL copied from Alibaba Cloud Bailian. URLs ending in /compatible-mode/v1 are supported; the plugin automatically derives /api/v1 for native image/video APIs.
      zh_Hans: 直接粘贴阿里云百炼控制台复制的 Base URL。支持以 /compatible-mode/v1 结尾的地址，插件会自动推导图片/视频原生接口使用的 /api/v1。
    label:
      en_US: Bailian Base URL
      zh_Hans: 百炼 Base URL
    placeholder:
      en_US: https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      zh_Hans: https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    required: true
    type: text-input
    url: https://help.aliyun.com/zh/model-studio/base-url

tools:
  - tools/z_image_text_2_image.yaml
  - tools/qwen_text_2_image.yaml
  - tools/qwen_image_2_image.yaml
  - tools/qwen_image_translate.yaml
  - tools/qwen_image_translate_query.yaml
  - tools/wan_text_2_image.yaml
  - tools/wan_image_2_image.yaml
  - tools/wan_text_2_video.yaml
  - tools/wan_first_image_2_video.yaml
  - tools/wan_first_end_image_2_video.yaml
  - tools/wan_reference_video.yaml
  - tools/wan_video_continue.yaml
  - tools/wan_video_query.yaml
  - tools/happyhorse_text_2_video.yaml
  - tools/happyhorse_image_2_video.yaml
  - tools/happyhorse_reference_video.yaml
  - tools/happyhorse_video_edit.yaml
extra:
  python:
    source: provider/tongyi_aigc.py
