identity:
  name: "qwen_image_2_image"
  author: "sawyer-shi"
  label:
    en_US: "Qwen Image to Image"
    zh_Hans: "Qwen-图生图"
description:
  human:
    en_US: "Generate images from text and reference images using Tongyi Qwen models"
    zh_Hans: "使用通义Qwen模型根据文本和参考图像生成图像"
  llm: "Generate images from text and reference images using Tongyi Qwen models"
parameters:
  - name: prompt
    type: string
    required: true
    label:
      en_US: Prompt
      zh_Hans: 提示词
    human_description:
      en_US: "Text description of the image you want to generate"
      zh_Hans: "您想要生成的图像的文本描述"
    llm_description: "Text description of the image to generate"
    form: llm
  - name: images
    type: files
    required: true
    label:
      en_US: Reference Image Files (1-3)
      zh_Hans: 参考图片文件(1-3张)
    human_description:
      en_US: "Reference image files for generation (1-3 images, <=10MB each)"
      zh_Hans: "用于生成的参考图片文件（1-3张，每张<=10MB）"
    llm_description: "Reference image files to use for generation"
    form: llm
  - name: size
    type: select
    required: false
    label:
      en_US: Image Size
      zh_Hans: 图像尺寸
    human_description:
      en_US: "Image size. 2.0: total pixels in [512*512, 2048*2048]; edit-max/plus: width & height in [512,2048]; qwen-image-edit does not support size"
      zh_Hans: "图像尺寸。2.0系列总像素需在[512*512,2048*2048]；edit-max/plus宽高需在[512,2048]；qwen-image-edit不支持size"
    llm_description: "Output size. 2.0 uses total-pixel range; edit-max/plus use width-height range; qwen-image-edit doesn't support this parameter"
    form: form
    options:
      - value: "1024*1024"
        label:
          en_US: "1:1 (1024*1024)"
          zh_Hans: "1:1 (1024*1024)"
      - value: "1536*1536"
        label:
          en_US: "1:1 (1536*1536)"
          zh_Hans: "1:1 (1536*1536)"
      - value: "768*1152"
        label:
          en_US: "2:3 (768*1152)"
          zh_Hans: "2:3 (768*1152)"
      - value: "1024*1536"
        label:
          en_US: "2:3 (1024*1536)"
          zh_Hans: "2:3 (1024*1536)"
      - value: "1152*768"
        label:
          en_US: "3:2 (1152*768)"
          zh_Hans: "3:2 (1152*768)"
      - value: "1536*1024"
        label:
          en_US: "3:2 (1536*1024)"
          zh_Hans: "3:2 (1536*1024)"
      - value: "960*1280"
        label:
          en_US: "3:4 (960*1280)"
          zh_Hans: "3:4 (960*1280)"
      - value: "1080*1440"
        label:
          en_US: "3:4 (1080*1440)"
          zh_Hans: "3:4 (1080*1440)"
      - value: "1280*960"
        label:
          en_US: "4:3 (1280*960)"
          zh_Hans: "4:3 (1280*960)"
      - value: "1440*1080"
        label:
          en_US: "4:3 (1440*1080)"
          zh_Hans: "4:3 (1440*1080)"
      - value: "720*1280"
        label:
          en_US: "9:16 (720*1280)"
          zh_Hans: "9:16 (720*1280)"
      - value: "1080*1920"
        label:
          en_US: "9:16 (1080*1920)"
          zh_Hans: "9:16 (1080*1920)"
      - value: "1280*720"
        label:
          en_US: "16:9 (1280*720)"
          zh_Hans: "16:9 (1280*720)"
      - value: "1920*1080"
        label:
          en_US: "16:9 (1920*1080)"
          zh_Hans: "16:9 (1920*1080)"
      - value: "1344*576"
        label:
          en_US: "21:9 (1344*576)"
          zh_Hans: "21:9 (1344*576)"
      - value: "2048*872"
        label:
          en_US: "21:9 (2048*872)"
          zh_Hans: "21:9 (2048*872)"
  - name: negative_prompt
    type: string
    required: false
    label:
      en_US: Negative Prompt
      zh_Hans: 反向提示词
    human_description:
      en_US: "Describe what you don't want in the image"
      zh_Hans: "描述不希望在图像中出现的内容"
    llm_description: "Negative prompt to restrict image content"
    form: llm
  - name: prompt_extend
    type: boolean
    required: false
    label:
      en_US: Prompt Extend
      zh_Hans: 提示词智能改写
    human_description:
      en_US: "Enable AI-powered prompt optimization"
      zh_Hans: "启用提示词智能改写"
    llm_description: "Whether to enable prompt intelligent rewriting"
    form: form
  - name: watermark
    type: boolean
    required: false
    label:
      en_US: Watermark
      zh_Hans: 水印
    human_description:
      en_US: "Whether to add watermark to the image"
      zh_Hans: "是否在图像上添加水印"
    llm_description: "Whether to add watermark"
    form: form
    default: false
  - name: seed
    type: number
    required: false
    label:
      en_US: Seed
      zh_Hans: 随机种子
    human_description:
      en_US: "Random seed for reproducible results"
      zh_Hans: "用于可重复结果的随机种子"
    llm_description: "Random seed for reproducible results"
    form: form
  - name: n
    type: number
    required: false
    label:
      en_US: Image Count
      zh_Hans: 图片数量
    human_description:
      en_US: "For qwen-image-2.0/edit-max/edit-plus: 1-6 images. qwen-image-edit is fixed to 1"
      zh_Hans: "qwen-image-2.0/edit-max/edit-plus支持1-6张，qwen-image-edit固定为1张"
    llm_description: "Image count. qwen-image-2.0/edit-max/edit-plus support 1-6; qwen-image-edit is fixed to 1"
    form: form
    default: 1
    min: 1
    max: 6
  - name: model
    type: select
    required: false
    label:
      en_US: Model Version
      zh_Hans: 模型版本
    human_description:
      en_US: "Choose the Qwen image editing model."
      zh_Hans: "选择千问图像编辑模型。"
    llm_description: "Choose the Qwen image editing model"
    form: form
    default: "qwen-image-3.0"
    options:
      - value: "qwen-image-3.0"
        label:
          en_US: "Qwen Image 3.0 (qwen-image-3.0) - ¥0.18 output + ¥0.02/input image"
          zh_Hans: "千问图像3.0（qwen-image-3.0）- 输出¥0.18 + 输入图¥0.02/张"
      - value: "qwen-image-3.0-pro"
        label:
          en_US: "Qwen Image 3.0 Pro (qwen-image-3.0-pro)"
          zh_Hans: "千问图像3.0 Pro（qwen-image-3.0-pro）"
      - value: "qwen-image-2.1-pro"
        label:
          en_US: "Qwen Image 2.1 Pro (qwen-image-2.1-pro)"
          zh_Hans: "千问图像2.1 Pro（qwen-image-2.1-pro）"
      - value: "qwen-image-2.0"
        label:
          en_US: "Qwen Image 2.0 (qwen-image-2.0) - ¥0.20/image"
          zh_Hans: "千问图像2.0（qwen-image-2.0）- ¥0.20/张"
      - value: "qwen-image-2.0-pro"
        label:
          en_US: "Qwen Image 2.0 Pro (qwen-image-2.0-pro) - ¥0.50/image"
          zh_Hans: "千问图像2.0 Pro（qwen-image-2.0-pro）- ¥0.50/张"
      - value: "qwen-image-edit-plus"
        label:
          en_US: "Qwen Image Edit Plus (qwen-image-edit-plus) - ¥0.20/image"
          zh_Hans: "千问图像编辑Plus（qwen-image-edit-plus）- ¥0.20/张"
      - value: "qwen-image-edit-max"
        label:
          en_US: "Qwen Image Edit Max (qwen-image-edit-max) - ¥0.50/image"
          zh_Hans: "千问图像编辑Max（qwen-image-edit-max）- ¥0.50/张"
      - value: "qwen-image-edit"
        label:
          en_US: "Qwen Image Edit (qwen-image-edit) - ¥0.30/image"
          zh_Hans: "千问图像编辑（qwen-image-edit）- ¥0.30/张"

extra:
  python:
    source: tools/qwen_image_2_image.py
