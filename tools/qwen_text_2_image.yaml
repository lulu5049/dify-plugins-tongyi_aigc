identity:
  name: "qwen_text_2_image"
  author: "sawyer-shi"
  label:
    en_US: "Qwen Text to Image"
    zh_Hans: "Qwen-文生图"
description:
  human:
    en_US: "Generate images from text using Tongyi Qwen image models"
    zh_Hans: "使用通义Qwen模型根据文本描述生成图像"
  llm: "Generate images from text using Tongyi Qwen image models"
parameters:
  - name: prompt
    type: string
    required: true
    label:
      en_US: Prompt
      zh_Hans: 提示词
    human_description:
      en_US: "Text description of the image you want to generate"
      zh_Hans: "您想要生成的图像的文本描述"
    llm_description: "Text description of the image to generate"
    form: llm
  - name: size
    type: select
    required: false
    label:
      en_US: Image Size
      zh_Hans: 图像尺寸
    human_description:
      en_US: "Size of the generated image"
      zh_Hans: "生成图像的尺寸"
    llm_description: "Size of the generated image"
    form: form
    default: "1024*1024"
    options:
      - value: "1024*1024"
        label:
          en_US: "1:1 (1024*1024, economical 1K)"
          zh_Hans: "1:1（1024*1024，经济1K档）"
      - value: "2048*2048"
        label:
          en_US: "1:1 (2048*2048, 2.0 default)"
          zh_Hans: "1:1 (2048*2048, 2.0默认)"
      - value: "2688*1536"
        label:
          en_US: "16:9 (2688*1536, 2.0)"
          zh_Hans: "16:9 (2688*1536, 2.0)"
      - value: "1536*2688"
        label:
          en_US: "9:16 (1536*2688, 2.0)"
          zh_Hans: "9:16 (1536*2688, 2.0)"
      - value: "2368*1728"
        label:
          en_US: "4:3 (2368*1728, 2.0)"
          zh_Hans: "4:3 (2368*1728, 2.0)"
      - value: "1728*2368"
        label:
          en_US: "3:4 (1728*2368, 2.0)"
          zh_Hans: "3:4 (1728*2368, 2.0)"
      - value: "1664*928"
        label:
          en_US: "16:9 (1664*928, max/plus)"
          zh_Hans: "16:9 (1664*928, max/plus)"
      - value: "1472*1104"
        label:
          en_US: "4:3 (1472*1104, max/plus)"
          zh_Hans: "4:3 (1472*1104, max/plus)"
      - value: "1328*1328"
        label:
          en_US: "1:1 (1328*1328, max/plus)"
          zh_Hans: "1:1 (1328*1328, max/plus)"
      - value: "1104*1472"
        label:
          en_US: "3:4 (1104*1472, max/plus)"
          zh_Hans: "3:4 (1104*1472, max/plus)"
      - value: "928*1664"
        label:
          en_US: "9:16 (928*1664, max/plus)"
          zh_Hans: "9:16 (928*1664, max/plus)"
  - name: n
    type: number
    required: false
    label:
      en_US: Image Count
      zh_Hans: 出图数量
    human_description:
      en_US: "For qwen-image-2.0 series: 1-6 images. Other models are fixed to 1"
      zh_Hans: "qwen-image-2.0系列支持1-6张，其他模型固定为1"
    llm_description: "Image count. qwen-image-2.0 series supports 1-6; other models are fixed to 1"
    form: form
    default: 1
  - name: negative_prompt
    type: string
    required: false
    label:
      en_US: Negative Prompt
      zh_Hans: 反向提示词
    human_description:
      en_US: "Describe what you don't want in the image"
      zh_Hans: "描述不希望在图像中出现的内容"
    llm_description: "Negative prompt to restrict image content"
    form: llm
  - name: prompt_extend
    type: boolean
    required: false
    label:
      en_US: Prompt Extend
      zh_Hans: 提示词智能改写
    human_description:
      en_US: "Enable AI-powered prompt optimization"
      zh_Hans: "启用提示词智能改写"
    llm_description: "Whether to enable prompt intelligent rewriting"
    form: form
  - name: watermark
    type: boolean
    required: false
    label:
      en_US: Watermark
      zh_Hans: 水印
    human_description:
      en_US: "Whether to add watermark to the image"
      zh_Hans: "是否在图像上添加水印"
    llm_description: "Whether to add watermark"
    form: form
    default: false
  - name: seed
    type: number
    required: false
    label:
      en_US: Seed
      zh_Hans: 随机种子
    human_description:
      en_US: "Random seed for reproducible results"
      zh_Hans: "用于可重复结果的随机种子"
    llm_description: "Random seed for reproducible results"
    form: form
  - name: model
    type: select
    required: false
    label:
      en_US: Model Version
      zh_Hans: 模型版本
    human_description:
      en_US: "Choose the Qwen image model. Default favors the lowest current Beijing cost tier."
      zh_Hans: "选择千问图像模型。默认优先当前北京区低成本档。"
    llm_description: "Choose the Qwen image model"
    form: form
    default: "qwen-image-3.0"
    options:
      - value: "qwen-image-3.0"
        label:
          en_US: "Qwen Image 3.0 (qwen-image-3.0) - ¥0.18/image at 1K"
          zh_Hans: "千问图像3.0（qwen-image-3.0）- 1K ¥0.18/张"
      - value: "qwen-image-3.0-pro"
        label:
          en_US: "Qwen Image 3.0 Pro (qwen-image-3.0-pro) - ¥0.25/image at 1K"
          zh_Hans: "千问图像3.0 Pro（qwen-image-3.0-pro）- 1K ¥0.25/张"
      - value: "qwen-image-2.1-pro"
        label:
          en_US: "Qwen Image 2.1 Pro (qwen-image-2.1-pro) - ¥0.25/image"
          zh_Hans: "千问图像2.1 Pro（qwen-image-2.1-pro）- ¥0.25/张"
      - value: "qwen-image-2.0"
        label:
          en_US: "Qwen Image 2.0 (qwen-image-2.0) - ¥0.20/image"
          zh_Hans: "千问图像2.0（qwen-image-2.0）- ¥0.20/张"
      - value: "qwen-image-2.0-pro"
        label:
          en_US: "Qwen Image 2.0 Pro (qwen-image-2.0-pro) - ¥0.50/image"
          zh_Hans: "千问图像2.0 Pro（qwen-image-2.0-pro）- ¥0.50/张"
      - value: "qwen-image-plus"
        label:
          en_US: "Qwen Image Plus (qwen-image-plus) - ¥0.20/image"
          zh_Hans: "千问图像Plus（qwen-image-plus）- ¥0.20/张"
      - value: "qwen-image-max"
        label:
          en_US: "Qwen Image Max (qwen-image-max) - ¥0.50/image"
          zh_Hans: "千问图像Max（qwen-image-max）- ¥0.50/张"
      - value: "qwen-image"
        label:
          en_US: "Qwen Image (qwen-image) - ¥0.25/image"
          zh_Hans: "千问图像（qwen-image）- ¥0.25/张"

extra:
  python:
    source: tools/qwen_text_2_image.py
