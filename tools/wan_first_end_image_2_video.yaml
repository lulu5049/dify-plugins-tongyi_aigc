identity:
  name: "wan_first_end_image_2_video"
  author: "sawyer-shi"
  label:
    en_US: "Wan-First/Last Frame to Video"
    zh_Hans: "Wan-首尾帧图生视频"
description:
  human:
    en_US: "Generate video from first and last frame images using Tongyi Wanxiang API"
    zh_Hans: "使用通义万相模型从首尾帧图片生成视频"
  llm: "Create video from first and last frame images with customizable parameters."
parameters:
  - name: model
    type: select
    required: true
    label:
      en_US: "Model"
      zh_Hans: "模型"
    human_description:
      en_US: "AI model to use for video generation"
      zh_Hans: "用于视频生成的AI模型"
    llm_description: "AI model for video generation"
    form: form
    default: "wan2.2-kf2v-flash"
    options:
      - value: "wan3.0-video-prime"
        label:
          en_US: "Wan 3.0 Video Prime (wan3.0-video-prime)"
          zh_Hans: "万相3.0视频优速版（wan3.0-video-prime）"
      - value: "wan3.0-video"
        label:
          en_US: "Wan 3.0 Video (wan3.0-video)"
          zh_Hans: "万相3.0视频（wan3.0-video）"
      - value: "wan2.7-i2v"
        label:
          en_US: "Wanxiang 2.7 Image to Video (wan2.7-i2v)"
          zh_Hans: "万相2.7图生视频（wan2.7-i2v）"
      - value: "wan2.2-kf2v-flash"
        label:
          en_US: "Wanxiang 2.2 First/Last Frame (wan2.2-kf2v-flash)"
          zh_Hans: "万相2.2首尾帧（wan2.2-kf2v-flash）"
      - value: "wanx2.1-kf2v-plus"
        label:
          en_US: "Wanxiang 2.1 First/Last Frame Plus (wanx2.1-kf2v-plus)"
          zh_Hans: "万相2.1首尾帧增强版（wanx2.1-kf2v-plus）"
  - name: prompt
    type: string
    required: false
    label:
      en_US: "Prompt"
      zh_Hans: "提示词"
    human_description:
      en_US: "Text description for video generation (recommended for wan2.7-i2v; required for wan2.2 non-template mode)"
      zh_Hans: "视频生成的文本描述（wan2.7-i2v 推荐填写；wan2.2 非模板模式必填）"
    llm_description: "Text prompt describing the video to generate"
    form: llm
  - name: negative_prompt
    type: string
    required: false
    label:
      en_US: "Negative Prompt"
      zh_Hans: "反向提示词"
    human_description:
      en_US: "Describe what you don't want in the video"
      zh_Hans: "描述不希望在视频中出现的内容"
    llm_description: "Negative prompt to restrict video content"
    form: llm
  - name: first_frame_image
    type: file
    required: true
    label:
      en_US: "First Frame Image"
      zh_Hans: "首帧图片"
    human_description:
      en_US: "Upload the first frame image"
      zh_Hans: "上传首帧图片"
    llm_description: "Upload the first frame image"
    form: llm
  - name: last_frame_image
    type: file
    required: false
    label:
      en_US: "Last Frame Image"
      zh_Hans: "尾帧图片"
    human_description:
      en_US: "Upload the last frame image (required when not using template)"
      zh_Hans: "上传尾帧图片（非模板模式必填）"
    llm_description: "Upload the last frame image"
    form: llm
  - name: audio_url
    type: string
    required: false
    label:
      en_US: "Audio URL"
      zh_Hans: "音频URL"
    human_description:
      en_US: "Optional audio URL, mainly for wan2.7-i2v first+last+audio mode"
      zh_Hans: "可选音频URL，主要用于 wan2.7-i2v 的首尾帧+音频模式"
    llm_description: "Optional audio URL"
    form: llm
  - name: template
    type: string
    required: false
    label:
      en_US: "Video Effect Template"
      zh_Hans: "视频特效模板"
    human_description:
      en_US: "Special effect template name for the video"
      zh_Hans: "视频特效模板名称"
    llm_description: "Special effect template name for the video"
    form: form
    default: ""
  - name: resolution
    type: select
    required: false
    label:
      en_US: "Resolution"
      zh_Hans: "分辨率"
    human_description:
      en_US: "Video resolution quality"
      zh_Hans: "视频分辨率质量"
    llm_description: "Video resolution quality"
    form: form
    options:
      - value: "480P"
        label:
          en_US: "480P"
          zh_Hans: "480P"
      - value: "720P"
        label:
          en_US: "720P"
          zh_Hans: "720P"
      - value: "1080P"
        label:
          en_US: "1080P"
          zh_Hans: "1080P"
  - name: ratio
    type: select
    required: false
    label:
      en_US: "Aspect Ratio"
      zh_Hans: "宽高比"
    human_description:
      en_US: "Used by Wan 3.0. Adaptive is recommended for first/last-frame generation."
      zh_Hans: "用于 Wan 3.0，首尾帧生成推荐 adaptive 自适应。"
    llm_description: "Aspect ratio for Wan 3.0 first/last-frame video"
    form: form
    options:
      - value: "adaptive"
        label:
          en_US: "Adaptive"
          zh_Hans: "自适应"
      - value: "21:9"
        label:
          en_US: "21:9"
          zh_Hans: "21:9"
      - value: "16:9"
        label:
          en_US: "16:9"
          zh_Hans: "16:9"
      - value: "4:3"
        label:
          en_US: "4:3"
          zh_Hans: "4:3"
      - value: "1:1"
        label:
          en_US: "1:1"
          zh_Hans: "1:1"
      - value: "3:4"
        label:
          en_US: "3:4"
          zh_Hans: "3:4"
      - value: "9:16"
        label:
          en_US: "9:16"
          zh_Hans: "9:16"
  - name: duration
    type: number
    required: false
    label:
      en_US: "Duration (seconds)"
      zh_Hans: "时长(秒)"
    human_description:
      en_US: "Wan 3.0: 2-30 seconds (or -1 smart duration). Wan 2.7: 2-15 seconds. Wan 2.2/2.1 first-last-frame models are fixed at 5 seconds."
      zh_Hans: "Wan 3.0：2-30秒（-1为智能时长）；Wan 2.7：2-15秒；Wan 2.2/2.1 首尾帧模型固定5秒。"
    llm_description: "Duration in seconds, validated by selected model"
    form: form
    default: 5
  - name: prompt_extend
    type: boolean
    required: false
    label:
      en_US: "Prompt Extend"
      zh_Hans: "提示词智能改写"
    human_description:
      en_US: "Enable AI-powered prompt optimization"
      zh_Hans: "启用提示词智能改写"
    llm_description: "Whether to enable prompt intelligent rewriting"
    form: form
    default: true
  - name: watermark
    type: boolean
    required: false
    label:
      en_US: "Watermark"
      zh_Hans: "水印"
    human_description:
      en_US: "Add watermark to the video"
      zh_Hans: "在视频中添加水印"
    llm_description: "Whether to add watermark"
    form: form
    default: true
  - name: seed
    type: number
    required: false
    label:
      en_US: "Seed"
      zh_Hans: "随机种子"
    human_description:
      en_US: "Random seed for reproducible results"
      zh_Hans: "用于可重复结果的随机种子"
    llm_description: "Random seed for reproducible results"
    form: form
    default: 0
extra:
  python:
    source: tools/wan_first_end_image_2_video.py
