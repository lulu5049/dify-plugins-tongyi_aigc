identity:
  name: "wan_text_2_video"
  author: "sawyer-shi"
  label:
    en_US: "Wan-Text to Video"
    zh_Hans: "Wan-文生视频"
description:
  human:
    en_US: "Generate video from text using Tongyi Wanxiang API"
    zh_Hans: "使用通义万相模型从文本生成视频"
  llm: "Create video from text with customizable parameters including model selection, prompt, resolution, duration, audio settings, and more."
parameters:
  - name: model
    type: select
    required: true
    label:
      en_US: "Model"
      zh_Hans: "模型"
    human_description:
      en_US: "AI model to use for text-to-video generation"
      zh_Hans: "用于文生视频的AI模型"
    llm_description: "AI model for text-to-video generation"
    form: form
    default: "wan2.2-t2v-plus"
    options:
      - value: "wan3.0-video-prime"
        label:
          en_US: "Wan 3.0 Video Prime (wan3.0-video-prime)"
          zh_Hans: "万相3.0视频优速版（wan3.0-video-prime）"
      - value: "wan3.0-video"
        label:
          en_US: "Wan 3.0 Video (wan3.0-video)"
          zh_Hans: "万相3.0视频（wan3.0-video）"
      - value: "wan2.7-t2v"
        label:
          en_US: "Wanxiang 2.7 Text to Video (wan2.7-t2v)"
          zh_Hans: "万相2.7文生视频（wan2.7-t2v）"
      - value: "wan2.6-t2v"
        label:
          en_US: "Wanxiang 2.6 Text to Video (wan2.6-t2v)"
          zh_Hans: "万相2.6文生视频（wan2.6-t2v）"
      - value: "wan2.5-t2v-preview"
        label:
          en_US: "Wanxiang 2.5 Text to Video Preview (wan2.5-t2v-preview)"
          zh_Hans: "万相2.5文生视频预览（wan2.5-t2v-preview）"
      - value: "wan2.2-t2v-plus"
        label:
          en_US: "Wanxiang 2.2 Text to Video Plus (wan2.2-t2v-plus)"
          zh_Hans: "万相2.2文生视频增强版（wan2.2-t2v-plus）"
      - value: "wanx2.1-t2v-turbo"
        label:
          en_US: "Wanxiang 2.1 Text to Video Turbo (wanx2.1-t2v-turbo)"
          zh_Hans: "万相2.1文生视频加速版（wanx2.1-t2v-turbo）"
      - value: "wanx2.1-t2v-plus"
        label:
          en_US: "Wanxiang 2.1 Text to Video Plus (wanx2.1-t2v-plus)"
          zh_Hans: "万相2.1文生视频增强版（wanx2.1-t2v-plus）"
  - name: prompt
    type: string
    required: true
    label:
      en_US: "Prompt"
      zh_Hans: "提示词"
    human_description:
      en_US: "Text description for video generation"
      zh_Hans: "视频生成的文本描述"
    llm_description: "Text prompt describing the video to generate"
    form: llm
  - name: negative_prompt
    type: string
    required: false
    label:
      en_US: "Negative Prompt"
      zh_Hans: "反向提示词"
    human_description:
      en_US: "Describe what you don't want in the video"
      zh_Hans: "描述不希望在视频中出现的内容"
    llm_description: "Negative prompt to restrict video content"
    form: llm
  - name: audio_url
    type: string
    required: false
    label:
      en_US: "Audio URL"
      zh_Hans: "音频URL"
    human_description:
      en_US: "Audio file URL for the video"
      zh_Hans: "视频音频文件URL"
    llm_description: "Audio file URL for the video"
    form: llm
  - name: size
    type: select
    required: false
    label:
      en_US: "Resolution"
      zh_Hans: "分辨率"
    human_description:
      en_US: "Used by Wan 2.6 and earlier. Options change with the selected model."
      zh_Hans: "用于 Wan 2.6 及更早模型，选项会随模型动态变化。"
    llm_description: "Legacy video size in width*height"
    form: form
    default: "832*480"
    options:
      - value: "832*480"
        label: { en_US: "832×480 (480P 16:9)", zh_Hans: "832×480（480P 16:9）" }
        show_on: [{ variable: model, value: "wan2.2-t2v-plus" }]
      - value: "1920*1080"
        label: { en_US: "1920×1080 (1080P 16:9)", zh_Hans: "1920×1080（1080P 16:9）" }
        show_on: [{ variable: model, value: "wan2.2-t2v-plus" }]
      - value: "832*480"
        label: { en_US: "832×480 (480P 16:9)", zh_Hans: "832×480（480P 16:9）" }
        show_on: [{ variable: model, value: "wanx2.1-t2v-turbo" }]
      - value: "1280*720"
        label: { en_US: "1280×720 (720P 16:9)", zh_Hans: "1280×720（720P 16:9）" }
        show_on: [{ variable: model, value: "wanx2.1-t2v-turbo" }]
      - value: "1280*720"
        label: { en_US: "1280×720 (720P 16:9)", zh_Hans: "1280×720（720P 16:9）" }
        show_on: [{ variable: model, value: "wanx2.1-t2v-plus" }]
      - value: "832*480"
        label: { en_US: "832×480 (480P 16:9)", zh_Hans: "832×480（480P 16:9）" }
        show_on: [{ variable: model, value: "wan2.5-t2v-preview" }]
      - value: "1280*720"
        label: { en_US: "1280×720 (720P 16:9)", zh_Hans: "1280×720（720P 16:9）" }
        show_on: [{ variable: model, value: "wan2.5-t2v-preview" }]
      - value: "1920*1080"
        label: { en_US: "1920×1080 (1080P 16:9)", zh_Hans: "1920×1080（1080P 16:9）" }
        show_on: [{ variable: model, value: "wan2.5-t2v-preview" }]
      - value: "1280*720"
        label: { en_US: "1280×720 (720P 16:9)", zh_Hans: "1280×720（720P 16:9）" }
        show_on: [{ variable: model, value: "wan2.6-t2v" }]
      - value: "1920*1080"
        label: { en_US: "1920×1080 (1080P 16:9)", zh_Hans: "1920×1080（1080P 16:9）" }
        show_on: [{ variable: model, value: "wan2.6-t2v" }]

  - name: resolution
    type: select
    required: false
    label: { en_US: "Resolution Tier", zh_Hans: "分辨率档位" }
    human_description:
      en_US: "Used by Wan 3.0 / Wan 2.7. Options change with the selected model."
      zh_Hans: "用于 Wan 3.0 / Wan 2.7，选项会随模型动态变化。"
    llm_description: "Resolution tier"
    form: form
    default: "480P"
    options:
      - value: "480P"
        label: { en_US: "480P", zh_Hans: "480P" }
        show_on: [{ variable: model, value: "wan3.0-video-prime" }]
      - value: "720P"
        label: { en_US: "720P", zh_Hans: "720P" }
        show_on: [{ variable: model, value: "wan3.0-video-prime" }]
      - value: "1080P"
        label: { en_US: "1080P", zh_Hans: "1080P" }
        show_on: [{ variable: model, value: "wan3.0-video-prime" }]
      - value: "480P"
        label: { en_US: "480P", zh_Hans: "480P" }
        show_on: [{ variable: model, value: "wan3.0-video" }]
      - value: "720P"
        label: { en_US: "720P", zh_Hans: "720P" }
        show_on: [{ variable: model, value: "wan3.0-video" }]
      - value: "1080P"
        label: { en_US: "1080P", zh_Hans: "1080P" }
        show_on: [{ variable: model, value: "wan3.0-video" }]
      - value: "720P"
        label: { en_US: "720P", zh_Hans: "720P" }
        show_on: [{ variable: model, value: "wan2.7-t2v" }]
      - value: "1080P"
        label: { en_US: "1080P", zh_Hans: "1080P" }
        show_on: [{ variable: model, value: "wan2.7-t2v" }]

  - name: ratio
    type: select
    required: false
    label: { en_US: "Aspect Ratio", zh_Hans: "宽高比" }
    human_description:
      en_US: "Used by Wan 3.0 / Wan 2.7."
      zh_Hans: "用于 Wan 3.0 / Wan 2.7。"
    llm_description: "Aspect ratio"
    form: form
    default: "16:9"
    options:
      - value: "adaptive"
        label: { en_US: "Adaptive", zh_Hans: "自适应" }
        show_on: [{ variable: model, value: "wan3.0-video-prime" }]
      - value: "16:9"
        label: { en_US: "16:9", zh_Hans: "16:9" }
        show_on: [{ variable: model, value: "wan3.0-video-prime" }]
      - value: "9:16"
        label: { en_US: "9:16", zh_Hans: "9:16" }
        show_on: [{ variable: model, value: "wan3.0-video-prime" }]
      - value: "adaptive"
        label: { en_US: "Adaptive", zh_Hans: "自适应" }
        show_on: [{ variable: model, value: "wan3.0-video" }]
      - value: "16:9"
        label: { en_US: "16:9", zh_Hans: "16:9" }
        show_on: [{ variable: model, value: "wan3.0-video" }]
      - value: "9:16"
        label: { en_US: "9:16", zh_Hans: "9:16" }
        show_on: [{ variable: model, value: "wan3.0-video" }]
      - value: "16:9"
        label: { en_US: "16:9", zh_Hans: "16:9" }
        show_on: [{ variable: model, value: "wan2.7-t2v" }]
      - value: "9:16"
        label: { en_US: "9:16", zh_Hans: "9:16" }
        show_on: [{ variable: model, value: "wan2.7-t2v" }]
      - value: "1:1"
        label: { en_US: "1:1", zh_Hans: "1:1" }
        show_on: [{ variable: model, value: "wan2.7-t2v" }]

  - name: duration
    type: select
    required: false
    label: { en_US: "Duration (seconds)", zh_Hans: "时长（秒）" }
    human_description:
      en_US: "Valid duration options are filtered by the selected model."
      zh_Hans: "可选时长会根据模型自动过滤。"
    llm_description: "Duration in seconds"
    form: form
    default: "5"
    options:
      - value: "5"
        label: { en_US: "5s", zh_Hans: "5秒" }
        show_on: [{ variable: model, value: "wan2.2-t2v-plus" }]
      - value: "5"
        label: { en_US: "5s", zh_Hans: "5秒" }
        show_on: [{ variable: model, value: "wanx2.1-t2v-turbo" }]
      - value: "5"
        label: { en_US: "5s", zh_Hans: "5秒" }
        show_on: [{ variable: model, value: "wanx2.1-t2v-plus" }]
      - value: "5"
        label: { en_US: "5s", zh_Hans: "5秒" }
        show_on: [{ variable: model, value: "wan2.5-t2v-preview" }]
      - value: "10"
        label: { en_US: "10s", zh_Hans: "10秒" }
        show_on: [{ variable: model, value: "wan2.5-t2v-preview" }]
      - value: "2"
        label: { en_US: "2s", zh_Hans: "2秒" }
        show_on: [{ variable: model, value: "wan2.6-t2v" }]
      - value: "5"
        label: { en_US: "5s", zh_Hans: "5秒" }
        show_on: [{ variable: model, value: "wan2.6-t2v" }]
      - value: "15"
        label: { en_US: "15s", zh_Hans: "15秒" }
        show_on: [{ variable: model, value: "wan2.6-t2v" }]
      - value: "2"
        label: { en_US: "2s", zh_Hans: "2秒" }
        show_on: [{ variable: model, value: "wan2.7-t2v" }]
      - value: "5"
        label: { en_US: "5s", zh_Hans: "5秒" }
        show_on: [{ variable: model, value: "wan2.7-t2v" }]
      - value: "15"
        label: { en_US: "15s", zh_Hans: "15秒" }
        show_on: [{ variable: model, value: "wan2.7-t2v" }]
      - value: "2"
        label: { en_US: "2s", zh_Hans: "2秒" }
        show_on: [{ variable: model, value: "wan3.0-video" }]
      - value: "5"
        label: { en_US: "5s", zh_Hans: "5秒" }
        show_on: [{ variable: model, value: "wan3.0-video" }]
      - value: "30"
        label: { en_US: "30s", zh_Hans: "30秒" }
        show_on: [{ variable: model, value: "wan3.0-video" }]
      - value: "2"
        label: { en_US: "2s", zh_Hans: "2秒" }
        show_on: [{ variable: model, value: "wan3.0-video-prime" }]
      - value: "5"
        label: { en_US: "5s", zh_Hans: "5秒" }
        show_on: [{ variable: model, value: "wan3.0-video-prime" }]
      - value: "30"
        label: { en_US: "30s", zh_Hans: "30秒" }
        show_on: [{ variable: model, value: "wan3.0-video-prime" }]

  - name: prompt_extend
    type: boolean
    required: false
    label:
      en_US: "Prompt Extend"
      zh_Hans: "提示词智能改写"
    human_description:
      en_US: "Enable AI-powered prompt optimization"
      zh_Hans: "启用提示词智能改写"
    llm_description: "Whether to enable prompt intelligent rewriting"
    form: form
    default: false
  - name: shot_type
    type: select
    required: false
    label:
      en_US: "Shot Type"
      zh_Hans: "镜头类型"
    human_description:
      en_US: "Type of video shot. Only valid for wan2.6-t2v."
      zh_Hans: "视频镜头类型。仅 wan2.6-t2v 生效。"
    llm_description: "Type of video shot, only for wan2.6-t2v"
    form: form
    default: "single"
    options:
      - value: "single"
        label:
          en_US: "Single"
          zh_Hans: "单镜头"
      - value: "multi"
        label:
          en_US: "Multi"
          zh_Hans: "多镜头"
  - name: audio
    type: boolean
    required: false
    label:
      en_US: "Auto Audio"
      zh_Hans: "自动音频"
    human_description:
      en_US: "Automatically add audio to the generated video"
      zh_Hans: "为生成的视频自动添加音频"
    llm_description: "Whether to automatically add audio"
    form: form
    default: false
  - name: watermark
    type: boolean
    required: false
    label:
      en_US: "Watermark"
      zh_Hans: "水印"
    human_description:
      en_US: "Add watermark to the video"
      zh_Hans: "在视频中添加水印"
    llm_description: "Whether to add watermark"
    form: form
    default: false
  - name: seed
    type: number
    required: false
    label:
      en_US: "Seed"
      zh_Hans: "随机种子"
    human_description:
      en_US: "Random seed for reproducible results"
      zh_Hans: "用于可重复结果的随机种子"
    llm_description: "Random seed for reproducible results"
    form: form
    default: 0
